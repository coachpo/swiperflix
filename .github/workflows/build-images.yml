name: Build Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to build"
        type: choice
        required: true
        default: all
        options:
          - all
          - gateway
          - player

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GATEWAY: ${{ github.repository }}-gateway
  IMAGE_NAME_PLAYER: ${{ github.repository }}-player
  GATEWAY_SERVICE: gateway
  PLAYER_SERVICE: player
  GATEWAY_DIR: swiperflix-gateway
  PLAYER_DIR: swiperflix-player
  BUILD_PLATFORM: linux/arm64
  DOCKER_DRIVER: docker-container
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.service != 'all' && format('["{0}"]', inputs.service) || '["gateway","player"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read service version
        id: version
        shell: bash
        run: |
          VERSION_FILE="${{ matrix.service == env.GATEWAY_SERVICE && format('{0}/VERSION', env.GATEWAY_DIR) || format('{0}/VERSION', env.PLAYER_DIR) }}"
          VERSION="$(tr -d '\r\n' < "$VERSION_FILE")"

          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty: $VERSION_FILE" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate VERSION matches service metadata
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "${{ env.GATEWAY_SERVICE }}" ]; then
            python3 - <<'PY'
            import pathlib
            import re

            version = pathlib.Path("swiperflix-gateway/VERSION").read_text().strip()
            pyproject = pathlib.Path("swiperflix-gateway/pyproject.toml").read_text()
            match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)

            if match is None:
                raise SystemExit("Could not find version in swiperflix-gateway/pyproject.toml")

            declared = match.group(1)

            if version != declared:
                raise SystemExit(
                    f"swiperflix-gateway/VERSION ({version}) does not match pyproject.toml ({declared})"
                )
            PY
          else
            python3 - <<'PY'
            import json
            import pathlib

            version = pathlib.Path("swiperflix-player/VERSION").read_text().strip()
            package = json.loads(pathlib.Path("swiperflix-player/package.json").read_text())
            declared = package["version"]

            if version != declared:
                raise SystemExit(
                    f"swiperflix-player/VERSION ({version}) does not match package.json ({declared})"
                )
            PY
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service == env.GATEWAY_SERVICE && env.IMAGE_NAME_GATEWAY || env.IMAGE_NAME_PLAYER }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Swiperflix ${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.service == env.GATEWAY_SERVICE && 'FastAPI backend implementing the Swiperflix playlist and reactions API.' || 'Vite frontend for the Swiperflix short-video player.' }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.service == env.GATEWAY_SERVICE && env.GATEWAY_DIR || env.PLAYER_DIR }}
          file: ${{ matrix.service == env.GATEWAY_SERVICE && format('{0}/Dockerfile', env.GATEWAY_DIR) || format('{0}/Dockerfile', env.PLAYER_DIR) }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service == env.GATEWAY_SERVICE && env.IMAGE_NAME_GATEWAY || env.IMAGE_NAME_PLAYER }}:cache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service == env.GATEWAY_SERVICE && env.IMAGE_NAME_GATEWAY || env.IMAGE_NAME_PLAYER }}:cache,mode=max
          platforms: ${{ env.BUILD_PLATFORM }}
          provenance: false
          sbom: false
